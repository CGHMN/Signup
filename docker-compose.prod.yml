include:
  - docker-compose.base.yml

services:
  app:
    image: app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    env_file:
      - path: ./.env
        required: false
    volumes:
      - app-storage:/var/www/html/var
    environment:
      - APP_ENV=prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  app-storage: {}
